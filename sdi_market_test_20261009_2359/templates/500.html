<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur temporaire</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; }
        main { width: min(100% - 32px, 560px); padding: 40px 24px; text-align: center; background: #fff; border: 1px solid #dbe3ef; border-radius: 12px; box-sizing: border-box; box-shadow: 0 12px 30px rgba(23, 32, 51, .08); }
        h1 { margin: 0 0 14px; font-size: clamp(1.5rem, 4vw, 2rem); }
        p { margin: 8px 0; line-height: 1.6; color: #4b5870; }
        nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
        a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 8px; background: #1d4ed8; color: #fff; text-decoration: none; font-weight: 700; }
        a.secondary { background: #e8eef8; color: #172033; }
    </style>
</head>
<body>
    <main>
        <h1>Une erreur temporaire est survenue.</h1>
        <p>Notre équipe a été informée du problème.</p>
        <p>Veuillez réessayer dans quelques instants.</p>
        <nav aria-label="Navigation de récupération">
            <a href="javascript:history.back()">Retour</a>
            <a href="/">Accueil</a>
            <a class="secondary" href="/search/">Produits</a>
        </nav>
    </main>
</body>
</html>
